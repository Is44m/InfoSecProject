<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} | {% endif %}PQC Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <meta name="description" content="A demonstration of Post-Quantum Cryptography techniques using Flask">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="{{ url_for('main.index') }}">
                    <span class="logo-icon">🔐</span>
                    <span class="logo-text">PQC Demo</span>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('main.index') }}" class="{{ 'active' if request.path == url_for('main.index') else '' }}">Home</a></li>
                    <li><a href="{{ url_for('main.about') }}" class="{{ 'active' if request.path == url_for('main.about') else '' }}">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Post-Quantum Cryptography Demo</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
